<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Wallet | ระบบบัญชีส่วนตัว</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --income: #10b981;
            --expense: #ef4444;
            --bg-gradient: linear-gradient(135deg, #f6f8fd 0%, #f1f5f9 100%);
            --card-bg: rgba(255, 255, 255, 0.9);
            --text-main: #1e293b;
            --text-muted: #64748b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Anuphan', sans-serif; }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            padding: 20px;
        }

        .app-container {
            max-width: 900px;
            margin: 0 auto;
        }

        /* --- Header & User Info --- */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            background: var(--card-bg);
            padding: 15px 25px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.03);
            backdrop-filter: blur(10px);
        }
        .user-profile { display: flex; align-items: center; gap: 15px; }
        .avatar { width: 50px; height: 50px; background: var(--primary); color: white; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 24px; font-weight: bold; }
        .user-info h2 { font-size: 18px; margin-bottom: 2px; }
        .user-info p { font-size: 13px; color: var(--text-muted); }
        .btn-icon { background: #e0e7ff; color: var(--primary); border: none; padding: 10px 15px; border-radius: 12px; font-weight: 600; cursor: pointer; transition: 0.3s; display: flex; align-items: center; gap: 8px; }
        .btn-icon:hover { background: var(--primary); color: white; transform: translateY(-2px); }

        /* --- Dashboard Cards --- */
        .dashboard {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }
        .card {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.04);
            position: relative;
            overflow: hidden;
            transition: transform 0.3s;
        }
        .card:hover { transform: translateY(-5px); }
        .card-icon { position: absolute; top: 20px; right: 20px; font-size: 40px; opacity: 0.1; }
        .card h3 { font-size: 15px; color: var(--text-muted); margin-bottom: 10px; font-weight: 500; }
        .card .amount { font-size: 32px; font-weight: 700; }
        .text-income { color: var(--income); }
        .text-expense { color: var(--expense); }

        /* --- Filters & Controls --- */
        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            gap: 15px;
            flex-wrap: wrap;
        }
        .filter-group { display: flex; gap: 10px; align-items: center; }
        select, input[type="date"], input[type="text"], input[type="number"] {
            padding: 12px 15px; border: 1px solid #e2e8f0; border-radius: 12px; font-family: 'Anuphan'; font-size: 15px; outline: none; background: white; transition: 0.3s;
        }
        select:focus, input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1); }
        .btn-primary {
            background: var(--primary); color: white; border: none; padding: 12px 25px; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; transition: 0.3s; box-shadow: 0 8px 20px rgba(79, 70, 229, 0.3); display: flex; align-items: center; gap: 8px;
        }
        .btn-primary:hover { background: var(--primary-hover); transform: translateY(-2px); box-shadow: 0 10px 25px rgba(79, 70, 229, 0.4); }

        /* --- Data Table --- */
        .table-container {
            background: var(--card-bg); border-radius: 24px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.04); overflow-x: auto;
        }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { padding: 15px; color: var(--text-muted); font-weight: 500; border-bottom: 2px solid #f1f5f9; }
        td { padding: 15px; border-bottom: 1px solid #f8fafc; vertical-align: middle; }
        tr:hover td { background: #f8fafc; }
        .badge { padding: 6px 12px; border-radius: 20px; font-size: 13px; font-weight: 600; }
        .badge-income { background: #dcfce7; color: var(--income); }
        .badge-expense { background: #fee2e2; color: var(--expense); }
        .btn-delete { background: #fee2e2; color: var(--expense); border: none; width: 35px; height: 35px; border-radius: 10px; cursor: pointer; display: flex; justify-content: center; align-items: center; font-size: 18px; transition: 0.2s; }
        .btn-delete:hover { background: var(--expense); color: white; transform: scale(1.1); }

        /* --- Modal (ป๊อปอัปฟอร์ม) --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); backdrop-filter: blur(5px); display: flex; justify-content: center; align-items: center; z-index: 1000; opacity: 0; visibility: hidden; transition: 0.3s;
        }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        .modal-content {
            background: white; width: 90%; max-width: 450px; padding: 30px; border-radius: 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.2); transform: translateY(20px); transition: 0.3s;
        }
        .modal-overlay.active .modal-content { transform: translateY(0); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .modal-header h2 { font-size: 20px; }
        .btn-close { background: none; border: none; font-size: 24px; cursor: pointer; color: var(--text-muted); }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-size: 14px; color: var(--text-muted); }
        .form-group input, .form-group select { width: 100%; }
        
        /* Custom Date Range Picker (ซ่อนตอนแรก) */
        #customDateSection { display: none; margin-left: 10px; align-items: center; gap: 5px; }

        @media(max-width: 768px) {
            .dashboard { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="app-container">
    
    <div class="header">
        <div class="user-profile">
            <div class="avatar" id="userInitial">?</div>
            <div class="user-info">
                <h2 id="userNameDisplay">กำลังโหลด...</h2>
                <p>ระบบจัดการเงินส่วนบุคคล</p>
            </div>
        </div>
        <button class="btn-icon" onclick="addFriendPrompt()">
            <i class='bx bx-user-plus'></i> เพิ่มผู้ใช้ / เพื่อน
        </button>
    </div>

    <div class="dashboard">
        <div class="card" style="background: var(--primary); color: white;">
            <i class='bx bx-wallet card-icon' style="color: white;"></i>
            <h3 style="color: #e0e7ff;">ยอดคงเหลือช่วงเวลานี้</h3>
            <div class="amount" id="sumBalance">฿0.00</div>
        </div>
        <div class="card">
            <i class='bx bx-trending-up card-icon' style="color: var(--income);"></i>
            <h3>รายรับ</h3>
            <div class="amount text-income" id="sumIncome">฿0.00</div>
        </div>
        <div class="card">
            <i class='bx bx-trending-down card-icon' style="color: var(--expense);"></i>
            <h3>รายจ่าย</h3>
            <div class="amount text-expense" id="sumExpense">฿0.00</div>
        </div>
    </div>

    <div class="controls">
        <div class="filter-group">
            <select id="timeFilter" onchange="handleFilterChange()">
                <option value="all">ดูทั้งหมด</option>
                <option value="day">วันนี้</option>
                <option value="week">สัปดาห์นี้ (อา-ส)</option>
                <option value="month" selected>เดือนนี้</option>
                <option value="year">ปีนี้</option>
                <option value="custom">ระบุช่วงเวลาเอง...</option>
            </select>
            
            <div id="customDateSection">
                <input type="date" id="dateStart" onchange="applyCustomFilter()">
                <span>ถึง</span>
                <input type="date" id="dateEnd" onchange="applyCustomFilter()">
            </div>
        </div>

        <button class="btn-primary" onclick="openModal()">
            <i class='bx bx-plus-circle'></i> บันทึกรายการ
        </button>
    </div>

    <div class="table-container">
        <h3 style="margin-bottom: 15px;">ประวัติรายการ <span id="currentFilterText" style="font-size: 14px; font-weight: normal; color: #888;">(เดือนนี้)</span></h3>
        <table>
            <thead>
                <tr>
                    <th>วัน/เวลา</th>
                    <th>ประเภท</th>
                    <th>รายการ</th>
                    <th>จำนวนเงิน</th>
                    <th style="text-align: center;">ลบ</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                </tbody>
        </table>
    </div>
</div>

<div class="modal-overlay" id="addModal">
    <div class="modal-content">
        <div class="modal-header">
            <h2>เพิ่มรายการใหม่</h2>
            <button class="btn-close" onclick="closeModal()"><i class='bx bx-x'></i></button>
        </div>
        
        <div class="form-group" style="display: flex; gap: 10px;">
            <select id="inpType" style="flex: 1; font-weight: bold; color: var(--expense);">
                <option value="expense">จ่ายออก</option>
                <option value="income" style="color: var(--income);">รับเข้า</option>
            </select>
            <select id="inpMethod" style="flex: 1;">
                <option value="cash">เงินสด</option>
                <option value="bank">บัญชี</option>
            </select>
        </div>

        <div class="form-group" style="display: flex; gap: 10px;">
            <input type="date" id="inpDate">
            <input type="time" id="inpTime" step="1">
        </div>

        <div class="form-group">
            <label>รายการ / แท็ก</label>
            <input type="text" id="inpNote" placeholder="เช่น กินข้าว, โอนให้แม่..." autocomplete="off">
        </div>

        <div class="form-group">
            <label>จำนวนเงิน (บาท)</label>
            <input type="number" id="inpAmount" placeholder="0.00" style="font-size: 20px; font-weight: bold;">
        </div>

        <button class="btn-primary" style="width: 100%; justify-content: center; margin-top: 10px;" onclick="saveData()">
            บันทึกข้อมูล
        </button>
    </div>
</div>

<script>
    // ----------------------------------------------------
    // 1. ตั้งค่าและตัวแปรหลัก
    // ----------------------------------------------------
    const SUPABASE_URL = 'https://pehcsvahuounbxgqxbrt.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_at6z6lMA5mhi7XpdGPjglQ_18mLDuPZ'; 
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    
    let allData = []; // เก็บข้อมูลที่ดึงมาทั้งหมดไว้ในเครื่อง เพื่อให้กรองได้ไวไม่ต้องโหลดใหม่
    
    // 🔥 ระบบจำลองผู้ใช้: ดึง Token จาก URL (เช่น ?user=123) ถ้าไม่มี ให้ทึกทักว่าเป็น 'Admin'
    const urlParams = new URLSearchParams(window.location.search);
    const userId = urlParams.get('user') || 'admin_user';
    const userName = urlParams.get('name') || 'คุณมาย (Admin)';

    // เซ็ต UI โปรไฟล์
    document.getElementById('userNameDisplay').innerText = userName;
    document.getElementById('userInitial').innerText = userName.charAt(0);

    // ----------------------------------------------------
    // 2. การจัดการทำงานตอนเปิดหน้าเว็บ
    // ----------------------------------------------------
    window.onload = () => {
        // เปลี่ยนสี Dropdown ตามรายรับ/รายจ่าย
        document.getElementById('inpType').addEventListener('change', function() {
            this.style.color = this.value === 'income' ? 'var(--income)' : 'var(--expense)';
        });
        fetchData();
    };

    // ----------------------------------------------------
    // 3. ดึงข้อมูลจากฐานข้อมูล
    // ----------------------------------------------------
    async function fetchData() {
        // ดึงข้อมูลทั้งหมดของผู้ใช้นี้ (เดี๋ยวมาฟิลเตอร์ใน JS เอาเพื่อให้ไว)
        // **ในอนาคตถ้ามีตาราง Users ค่อยเปลี่ยนมาดึงตาม UUID จริงๆ**
        const { data, error } = await db
            .from('transactions')
            .select('*')
            // .eq('user_id', userId) <-- ปลดคอมเมนต์ตรงนี้ถ้าระบบผูกตาราง User เสร็จแล้ว
            .order('transaction_date', { ascending: false })
            .order('created_at', { ascending: false });

        if (error) {
            Swal.fire('Error', 'โหลดข้อมูลไม่สำเร็จ: ' + error.message, 'error');
            return;
        }

        allData = data;
        applyFilter(); // กรองตาม Dropdown เริ่มต้น (เดือนนี้)
    }

    // ----------------------------------------------------
    // 4. ระบบคัดกรองช่วงเวลา (Filter) อัจฉริยะ
    // ----------------------------------------------------
    function handleFilterChange() {
        const filter = document.getElementById('timeFilter').value;
        const customSec = document.getElementById('customDateSection');
        
        if (filter === 'custom') {
            customSec.style.display = 'flex';
        } else {
            customSec.style.display = 'none';
            applyFilter();
        }
    }

    function applyCustomFilter() { applyFilter(); }

    function applyFilter() {
        const filter = document.getElementById('timeFilter').value;
        const textLabel = document.getElementById('currentFilterText');
        
        const now = new Date();
        now.setHours(0,0,0,0);
        let filteredData = [];

        if (filter === 'all') {
            filteredData = allData;
            textLabel.innerText = '(ทั้งหมด)';
        } 
        else if (filter === 'day') {
            const todayStr = now.toISOString().split('T')[0];
            filteredData = allData.filter(d => d.transaction_date === todayStr);
            textLabel.innerText = '(วันนี้)';
        }
        else if (filter === 'week') {
            // คำนวณหาวันอาทิตย์ - เสาร์
            const dayOfWeek = now.getDay(); 
            const startOfWeek = new Date(now); startOfWeek.setDate(now.getDate() - dayOfWeek);
            const endOfWeek = new Date(startOfWeek); endOfWeek.setDate(startOfWeek.getDate() + 6);
            
            const startStr = startOfWeek.toISOString().split('T')[0];
            const endStr = endOfWeek.toISOString().split('T')[0];
            
            filteredData = allData.filter(d => d.transaction_date >= startStr && d.transaction_date <= endStr);
            textLabel.innerText = `(สัปดาห์นี้: ${startStr} ถึง ${endStr})`;
        }
        else if (filter === 'month') {
            const currentMonth = now.toISOString().slice(0, 7); // "YYYY-MM"
            filteredData = allData.filter(d => d.transaction_date.startsWith(currentMonth));
            textLabel.innerText = '(เดือนนี้)';
        }
        else if (filter === 'year') {
            const currentYear = now.getFullYear().toString();
            filteredData = allData.filter(d => d.transaction_date.startsWith(currentYear));
            textLabel.innerText = `(ปี ${currentYear})`;
        }
        else if (filter === 'custom') {
            const start = document.getElementById('dateStart').value;
            const end = document.getElementById('dateEnd').value;
            if(start && end) {
                filteredData = allData.filter(d => d.transaction_date >= start && d.transaction_date <= end);
                textLabel.innerText = `(${start} ถึง ${end})`;
            } else {
                filteredData = allData; // ถ้ายงไม่ได้เลือกก็โชว์หมดก่อน
            }
        }

        renderDashboardAndTable(filteredData);
    }

    // ----------------------------------------------------
    // 5. อัปเดตหน้าจอ (ตาราง + การ์ดยอดรวม)
    // ----------------------------------------------------
    function renderDashboardAndTable(data) {
        let totalIncome = 0;
        let totalExpense = 0;
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';

        if (data.length === 0) {
            tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; padding: 30px; color: #aaa;">ไม่มีรายการในหมวดหมู่นี้</td></tr>`;
        }

        data.forEach(item => {
            const isIncome = item.type === 'income';
            if(isIncome) totalIncome += item.amount;
            else totalExpense += item.amount;

            // สร้างแถวตาราง
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>
                    <div style="font-weight: 500;">${item.transaction_date}</div>
                </td>
                <td>
                    <span class="badge ${isIncome ? 'badge-income' : 'badge-expense'}">
                        ${isIncome ? 'รับเข้า' : 'จ่ายออก'}
                    </span>
                    <div style="font-size:12px; color:#888; margin-top:4px;">${item.method === 'cash' ? 'เงินสด' : 'บัญชี'}</div>
                </td>
                <td style="font-weight: 500;">${item.note}</td>
                <td style="font-weight: 600; color: ${isIncome ? 'var(--income)' : 'var(--expense)'}">
                    ${isIncome ? '+' : '-'}฿${item.amount.toLocaleString(undefined, {minimumFractionDigits: 2})}
                </td>
                <td style="text-align: center;">
                    <button class="btn-delete" onclick="deleteData('${item.id}')"><i class='bx bx-trash'></i></button>
                </td>
            `;
            tbody.appendChild(tr);
        });

        // อัปเดต Dashboard
        document.getElementById('sumIncome').innerText = `฿${totalIncome.toLocaleString(undefined, {minimumFractionDigits: 2})}`;
        document.getElementById('sumExpense').innerText = `฿${totalExpense.toLocaleString(undefined, {minimumFractionDigits: 2})}`;
        document.getElementById('sumBalance').innerText = `฿${(totalIncome - totalExpense).toLocaleString(undefined, {minimumFractionDigits: 2})}`;
    }

    // ----------------------------------------------------
    // 6. เพิ่มข้อมูล (Insert)
    // ----------------------------------------------------
    function openModal() {
        document.getElementById('addModal').classList.add('active');
        const now = new Date();
        document.getElementById('inpDate').value = now.toISOString().split('T')[0];
        document.getElementById('inpTime').value = now.toTimeString().split(' ')[0];
    }
    function closeModal() {
        document.getElementById('addModal').classList.remove('active');
    }

    async function saveData() {
        const type = document.getElementById('inpType').value;
        const method = document.getElementById('inpMethod').value;
        const date = document.getElementById('inpDate').value;
        const note = document.getElementById('inpNote').value || 'ไม่มีชื่อรายการ';
        const amount = document.getElementById('inpAmount').value;

        if (!amount || amount <= 0) {
            Swal.fire('เฮ้ยเดี๋ยว!', 'อย่าลืมใส่จำนวนเงินสิครับ', 'warning');
            return;
        }

        closeModal();
        
        // โชว์ Loading สวยๆ
        Swal.fire({ title: 'กำลังบันทึก...', allowOutsideClick: false, didOpen: () => { Swal.showLoading(); }});

        const { error } = await db.from('transactions').insert([
            { type, amount: parseFloat(amount), note, method, transaction_date: date }
        ]);

        if (error) {
            Swal.fire('พังเฉย!', error.message, 'error');
        } else {
            Swal.fire({ icon: 'success', title: 'บันทึกเรียบร้อย!', timer: 1500, showConfirmButton: false });
            document.getElementById('inpAmount').value = '';
            document.getElementById('inpNote').value = '';
            fetchData(); // รีเฟรชข้อมูลใหม่
        }
    }

    // ----------------------------------------------------
    // 7. ลบข้อมูล (Delete) + SweetAlert Confirm
    // ----------------------------------------------------
    function deleteData(id) {
        Swal.fire({
            title: 'แน่ใจนะว่าจะลบ?',
            text: "ลบแล้วเอากลับคืนมาไม่ได้นะ!",
            icon: 'warning',
            showCancelButton: true,
            confirmButtonColor: '#ef4444',
            cancelButtonColor: '#64748b',
            confirmButtonText: 'ลบเลย!',
            cancelButtonText: 'ยกเลิก'
        }).then(async (result) => {
            if (result.isConfirmed) {
                const { error } = await db.from('transactions').delete().eq('id', id);
                if (error) {
                    Swal.fire('ลบไม่ได้!', error.message, 'error');
                } else {
                    Swal.fire({ icon: 'success', title: 'ลบปลิวไปแล้ว!', timer: 1500, showConfirmButton: false });
                    fetchData();
                }
            }
        })
    }

    // ----------------------------------------------------
    // 8. ระบบสร้างลิงก์เพิ่มเพื่อน
    // ----------------------------------------------------
    async function addFriendPrompt() {
        const { value: friendName } = await Swal.fire({
            title: 'เพิ่มผู้ใช้งาน / เพื่อน',
            input: 'text',
            inputLabel: 'ใส่ชื่อเพื่อนที่คุณต้องการสร้างบัญชีให้',
            inputPlaceholder: 'เช่น อ้อม, มุก',
            showCancelButton: true,
            confirmButtonText: 'สร้างลิงก์เข้าใช้งาน',
            cancelButtonText: 'ยกเลิก'
        });

        if (friendName) {
            // สร้าง URL สั้นๆ ให้ก๊อปปี้ (จำลองการสร้าง Token)
            const fakeToken = "user_" + Math.floor(Math.random() * 1000000);
            const currentUrl = window.location.href.split('?')[0]; 
            const inviteLink = `${currentUrl}?user=${fakeToken}&name=${encodeURIComponent(friendName)}`;

            Swal.fire({
                title: 'สร้างลิงก์สำเร็จ!',
                html: `
                    <p style="font-size: 14px; margin-bottom: 10px;">ก๊อปปี้ลิงก์ด้านล่างส่งให้ <b>${friendName}</b> ได้เลย<br>(เขาจะเห็นแค่ข้อมูลของเขาเอง)</p>
                    <input type="text" value="${inviteLink}" style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #ccc;" readonly id="linkCopy">
                `,
                icon: 'success',
                confirmButtonText: 'ก๊อปปี้ลิงก์',
            }).then((result) => {
                if (result.isConfirmed) {
                    navigator.clipboard.writeText(inviteLink);
                    Swal.fire('ก๊อปปี้แล้ว!', '', 'success');
                }
            });
        }
    }
</script>

</body>
</html>
