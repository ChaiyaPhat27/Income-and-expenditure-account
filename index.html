<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Wallet | สับที่สุดในโลก</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --income: #10b981;
            --expense: #f43f5e;
            --bg-body: #f8fafc;
            --card-bg: rgba(255, 255, 255, 0.85);
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Anuphan', sans-serif; }

        body {
            background: linear-gradient(135deg, #e0e7ff 0%, #f8fafc 100%);
            color: var(--text-dark);
            min-height: 100vh;
            padding: 20px;
        }

        .app-container { max-width: 900px; margin: 0 auto; }

        /* --- Header --- */
        .header {
            display: flex; justify-content: space-between; align-items: center;
            background: var(--card-bg); padding: 15px 25px; border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.05); backdrop-filter: blur(12px);
            margin-bottom: 25px; border: 1px solid rgba(255,255,255,0.5);
        }
        .user-profile { display: flex; align-items: center; gap: 15px; }
        .avatar { width: 50px; height: 50px; background: linear-gradient(135deg, var(--primary), #a855f7); color: white; border-radius: 16px; display: flex; justify-content: center; align-items: center; font-size: 24px; font-weight: bold; box-shadow: 0 4px 10px rgba(99, 102, 241, 0.3); }
        .user-info h2 { font-size: 18px; margin-bottom: 2px; background: linear-gradient(135deg, #0f172a, #334155); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .user-info p { font-size: 13px; color: var(--text-muted); }
        
        /* ซ่อนปุ่มแอดมินเป็นค่าเริ่มต้น */
        #btnAddFriend { display: none; background: #e0e7ff; color: var(--primary); border: none; padding: 10px 15px; border-radius: 12px; font-weight: 600; cursor: pointer; transition: 0.3s; align-items: center; gap: 8px; }
        #btnAddFriend:hover { background: var(--primary); color: white; transform: translateY(-2px); }

        /* --- Dashboard --- */
        .dashboard { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 25px; }
        .card { background: var(--card-bg); padding: 25px; border-radius: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.04); position: relative; overflow: hidden; backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.6); transition: transform 0.3s; }
        .card:hover { transform: translateY(-5px); }
        .card-icon { position: absolute; top: -10px; right: -10px; font-size: 80px; opacity: 0.05; }
        .card h3 { font-size: 14px; color: var(--text-muted); margin-bottom: 8px; font-weight: 500; }
        .card .amount { font-size: 32px; font-weight: 700; letter-spacing: -0.5px; }
        
        .card-balance { background: linear-gradient(135deg, var(--primary), #818cf8); color: white; border: none; }
        .card-balance h3 { color: rgba(255,255,255,0.8); }

        /* --- Controls & Filters --- */
        .controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 15px; }
        .filter-box { display: flex; gap: 10px; align-items: center; background: white; padding: 5px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); }
        select, input { padding: 10px 15px; border: 1px solid var(--border); border-radius: 12px; font-family: 'Anuphan'; font-size: 15px; outline: none; background: #f8fafc; transition: 0.3s; }
        select:focus, input:focus { border-color: var(--primary); background: white; box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1); }
        
        .btn-primary { background: linear-gradient(135deg, var(--primary), #4f46e5); color: white; border: none; padding: 12px 25px; border-radius: 14px; font-size: 16px; font-weight: 600; cursor: pointer; transition: 0.3s; box-shadow: 0 8px 20px rgba(99, 102, 241, 0.3); display: flex; align-items: center; gap: 8px; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(99, 102, 241, 0.4); }

        /* --- Table --- */
        .table-container { background: var(--card-bg); border-radius: 24px; padding: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.04); overflow-x: auto; backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.5); }
        table { width: 100%; border-collapse: collapse; }
        th { padding: 15px; color: var(--text-muted); font-weight: 500; border-bottom: 2px solid var(--border); text-align: left; }
        td { padding: 15px; border-bottom: 1px solid #f1f5f9; vertical-align: middle; }
        tr:hover td { background: rgba(241, 245, 249, 0.5); }
        
        .bank-badge { display: inline-flex; align-items: center; gap: 5px; background: #f1f5f9; padding: 5px 10px; border-radius: 10px; font-size: 12px; font-weight: 600; color: var(--text-dark); margin-top: 5px; }
        .type-badge { padding: 6px 12px; border-radius: 20px; font-size: 13px; font-weight: 600; }
        .btn-delete { background: #ffe4e6; color: var(--expense); border: none; width: 35px; height: 35px; border-radius: 10px; cursor: pointer; display: flex; justify-content: center; align-items: center; font-size: 18px; transition: 0.2s; }
        .btn-delete:hover { background: var(--expense); color: white; transform: scale(1.1); }

        /* --- Modals (ซ่อนไว้ตอนแรก) --- */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.4); backdrop-filter: blur(8px); display: flex; justify-content: center; align-items: center; z-index: 1000; opacity: 0; visibility: hidden; transition: 0.3s; }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        .modal-content { background: white; width: 90%; max-width: 450px; padding: 30px; border-radius: 24px; box-shadow: 0 25px 50px rgba(0,0,0,0.2); transform: translateY(20px); transition: 0.3s; }
        .modal-overlay.active .modal-content { transform: translateY(0); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .btn-close { background: #f1f5f9; border: none; width: 35px; height: 35px; border-radius: 50%; font-size: 20px; cursor: pointer; color: var(--text-muted); display: flex; justify-content: center; align-items: center; transition: 0.2s; }
        .btn-close:hover { background: #e2e8f0; color: var(--text-dark); }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-size: 14px; color: var(--text-muted); font-weight: 500; }
        .form-group input, .form-group select { width: 100%; }

        #customDateSection { display: none; align-items: center; gap: 5px; }

        @media(max-width: 768px) {
            .dashboard { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="app-container">
    
    <div class="header">
        <div class="user-profile">
            <div class="avatar" id="userInitial">?</div>
            <div class="user-info">
                <h2 id="userNameDisplay">กำลังโหลด...</h2>
                <p>Private Wallet</p>
            </div>
        </div>
        <button id="btnAddFriend" onclick="addFriendPrompt()">
            <i class='bx bx-user-plus'></i> เพิ่มผู้ใช้
        </button>
    </div>

    <div class="dashboard">
        <div class="card card-balance">
            <i class='bx bx-wallet card-icon'></i>
            <h3>ยอดเงินคงเหลือรวม (ช่วงเวลานี้)</h3>
            <div class="amount" id="sumBalance">฿0.00</div>
        </div>
        <div class="card">
            <i class='bx bx-trending-up card-icon' style="color: var(--income);"></i>
            <h3>รายรับ</h3>
            <div class="amount" id="sumIncome" style="color: var(--income);">฿0.00</div>
        </div>
        <div class="card">
            <i class='bx bx-trending-down card-icon' style="color: var(--expense);"></i>
            <h3>รายจ่าย</h3>
            <div class="amount" id="sumExpense" style="color: var(--expense);">฿0.00</div>
        </div>
    </div>

    <div class="controls">
        <div class="filter-box">
            <i class='bx bx-filter-alt' style="color: var(--primary); font-size: 20px; margin-left: 10px;"></i>
            <select id="timeFilter" onchange="handleFilterChange()" style="border: none; background: transparent; padding-left: 5px;">
                <option value="all">ดูทั้งหมด</option>
                <option value="day">วันนี้</option>
                <option value="week">สัปดาห์นี้ (อา-ส)</option>
                <option value="month" selected>เดือนนี้</option>
                <option value="year">ปีนี้</option>
                <option value="custom">ระบุช่วงเวลา...</option>
            </select>
            
            <div id="customDateSection">
                <input type="date" id="dateStart" onchange="applyFilter()">
                <span style="color: #888; font-size: 14px;">ถึง</span>
                <input type="date" id="dateEnd" onchange="applyFilter()">
            </div>
        </div>

        <button class="btn-primary" onclick="openTxnModal()">
            <i class='bx bx-plus-circle'></i> บันทึกรายการ
        </button>
    </div>

    <div class="table-container">
        <h3 style="margin-bottom: 20px; font-size: 18px;">ประวัติทำรายการ <span id="currentFilterText" style="font-size: 14px; font-weight: normal; color: #888;"></span></h3>
        <table>
            <thead>
                <tr>
                    <th>วัน/เวลา</th>
                    <th>ประเภท / บัญชี</th>
                    <th>รายการ</th>
                    <th>จำนวนเงิน</th>
                    <th style="text-align: center;">จัดการ</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <tr><td colspan="5" style="text-align:center; padding:30px; color:#aaa;">กำลังโหลดข้อมูล...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<div class="modal-overlay" id="txnModal">
    <div class="modal-content">
        <div class="modal-header">
            <h2 style="font-size: 22px;">เพิ่มรายการใหม่</h2>
            <button class="btn-close" onclick="closeModal('txnModal')"><i class='bx bx-x'></i></button>
        </div>
        
        <div class="form-group" style="display: flex; gap: 10px;">
            <div style="flex: 1;">
                <label>ประเภท</label>
                <select id="inpType" style="font-weight: bold; color: var(--expense);" onchange="this.style.color = this.value === 'income' ? 'var(--income)' : 'var(--expense)'">
                    <option value="expense">จ่ายออก</option>
                    <option value="income" style="color: var(--income);">รับเข้า</option>
                </select>
            </div>
            <div style="flex: 1;">
                <label>วันที่</label>
                <input type="date" id="inpDate">
            </div>
        </div>

        <div class="form-group">
            <label style="display: flex; justify-content: space-between;">
                <span>กระเป๋าเงิน / บัญชีธนาคาร</span>
                <span style="color: var(--primary); cursor: pointer; font-size: 12px; font-weight: 600;" onclick="openBankModal()">+ เพิ่มบัญชีใหม่</span>
            </label>
            <select id="inpMethod"></select>
        </div>

        <div class="form-group">
            <label>รายการ / บันทึกช่วยจำ</label>
            <input type="text" id="inpNote" placeholder="เช่น ค่ากาแฟ, โอนให้แม่..." autocomplete="off">
        </div>

        <div class="form-group">
            <label>จำนวนเงิน (บาท)</label>
            <input type="number" id="inpAmount" placeholder="0.00" style="font-size: 24px; font-weight: bold; padding: 15px; color: var(--primary);">
        </div>

        <button class="btn-primary" style="width: 100%; justify-content: center; margin-top: 20px; padding: 15px;" onclick="saveTransaction()">
            บันทึกข้อมูล
        </button>
    </div>
</div>

<div class="modal-overlay" id="bankModal" style="z-index: 1005;">
    <div class="modal-content" style="max-width: 400px;">
        <div class="modal-header">
            <h2 style="font-size: 20px;">เพิ่มบัญชีธนาคาร</h2>
            <button class="btn-close" onclick="closeModal('bankModal')"><i class='bx bx-x'></i></button>
        </div>
        
        <div class="form-group">
            <label>เลือกธนาคาร / กระเป๋าเงิน</label>
            <select id="inpBankName">
                <option value="เงินสด">💵 เงินสด</option>
                <option value="KBank (กสิกร)">🟢 KBank (กสิกร)</option>
                <option value="SCB (ไทยพาณิชย์)">🟣 SCB (ไทยพาณิชย์)</option>
                <option value="Krungthai (กรุงไทย)">🔵 Krungthai (กรุงไทย)</option>
                <option value="BBL (กรุงเทพ)">🟦 BBL (กรุงเทพ)</option>
                <option value="Krungsri (กรุงศรี)">🟨 Krungsri (กรุงศรี)</option>
                <option value="TrueMoney Wallet">🟧 TrueMoney Wallet</option>
            </select>
        </div>

        <div class="form-group">
            <label>เลขบัญชี (ใส่หรือไม่ใส่ก็ได้)</label>
            <input type="text" id="inpAccNo" placeholder="เช่น 123-4-56789-0">
        </div>

        <button class="btn-primary" style="width: 100%; justify-content: center; background: #10b981;" onclick="saveBankAccount()">
            ยืนยันเพิ่มบัญชี
        </button>
    </div>
</div>

<script>
    // --- 1. ตั้งค่า Supabase ---
    const SUPABASE_URL = 'https://pehcsvahuounbxgqxbrt.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_at6z6lMA5mhi7XpdGPjglQ_18mLDuPZ'; 
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    
    // --- 2. ระบบแยก User (สำคัญมาก!) ---
    const urlParams = new URLSearchParams(window.location.search);
    const ownerToken = urlParams.get('user') || 'admin'; // ป้ายชื่อประจำตัว
    const userName = urlParams.get('name') || 'คุณมาย (Admin)';
    const isAdmin = (ownerToken === 'admin');

    let allTransactions = []; 
    let myWallets = [];

    // --- 3. เริ่มต้นการทำงาน (Init) ---
    window.onload = async () => {
        // เซ็ตชื่อหน้าจอ
        document.getElementById('userNameDisplay').innerText = userName;
        document.getElementById('userInitial').innerText = userName.charAt(0);
        
        // ✨ ล็อคปุ่ม Admin: โชว์ปุ่ม +เพื่อน เฉพาะแอดมินเท่านั้น!
        if(isAdmin) {
            document.getElementById('btnAddFriend').style.display = 'flex';
        }

        // เช็คกระเป๋าเงินก่อน ว่าคนนี้มีบัญชีรึยัง
        await checkAndLoadWallets();
        // ดึงประวัติรายการของคนนี้
        await fetchTransactions();
    };

    // --- 4. จัดการกระเป๋าเงิน (Payment Methods) ---
    async function checkAndLoadWallets() {
        // ดึงกระเป๋าเงินเฉพาะของคนนี้ (eq owner_token)
        const { data, error } = await db.from('payment_methods').select('*').eq('owner_token', ownerToken);
        
        if (error) { console.error(error); return; }

        if (data.length === 0) {
            // ถ้าเป็นผู้ใช้ใหม่เพิ่งเข้ามาครั้งแรก ใจดีสร้างกระเป๋า "เงินสด" ให้เลยอัตโนมัติ
            const { data: newWallet } = await db.from('payment_methods').insert([{ owner_token: ownerToken, bank_name: 'เงินสด', account_no: '' }]).select();
            myWallets = newWallet;
        } else {
            myWallets = data;
        }
        renderWalletDropdown();
    }

    function renderWalletDropdown() {
        const select = document.getElementById('inpMethod');
        select.innerHTML = '';
        myWallets.forEach(w => {
            const accText = w.account_no ? ` (${w.account_no})` : '';
            select.innerHTML += `<option value="${w.id}">${w.bank_name}${accText}</option>`;
        });
    }

    async function saveBankAccount() {
        const bankName = document.getElementById('inpBankName').value;
        const accNo = document.getElementById('inpAccNo').value;

        Swal.fire({ title: 'กำลังบันทึก...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

        const { error } = await db.from('payment_methods').insert([{ 
            owner_token: ownerToken, bank_name: bankName, account_no: accNo 
        }]);

        if (error) {
            Swal.fire('เพิ่มบัญชีไม่สำเร็จ', error.message, 'error');
        } else {
            Swal.fire({ icon: 'success', title: 'เพิ่มบัญชีเรียบร้อย!', timer: 1500, showConfirmButton: false });
            document.getElementById('inpAccNo').value = '';
            closeModal('bankModal');
            await checkAndLoadWallets(); // โหลดกระเป๋าใหม่ใส่ Dropdown
        }
    }

    // --- 5. จัดการรายการรับ-จ่าย (Transactions) ---
    async function fetchTransactions() {
        // ดึงประวัติ *เฉพาะของคนนี้* พร้อมกับไปดึงชื่อธนาคารจากอีกตารางมาผูกให้ด้วย (โคตรจึ้ง)
        const { data, error } = await db
            .from('transactions')
            .select(`*, payment_methods ( bank_name, account_no )`)
            .eq('owner_token', ownerToken) // ล็อคเป้า! ห้ามเอาของเพื่อนมาโชว์
            .order('transaction_date', { ascending: false })
            .order('created_at', { ascending: false });

        if (error) { Swal.fire('Error', error.message, 'error'); return; }
        
        allTransactions = data;
        applyFilter(); // กรองตามเดือนปัจจุบันเป็นค่าเริ่มต้น
    }

    // --- 6. ระบบ Filter อัจฉริยะ (แบบ Real-time) ---
    function handleFilterChange() {
        const filter = document.getElementById('timeFilter').value;
        document.getElementById('customDateSection').style.display = (filter === 'custom') ? 'flex' : 'none';
        if(filter !== 'custom') applyFilter();
    }

    function applyFilter() {
        const filter = document.getElementById('timeFilter').value;
        const textLabel = document.getElementById('currentFilterText');
        const now = new Date();
        let filteredData = [];

        if (filter === 'all') {
            filteredData = allTransactions;
            textLabel.innerText = '(ทุกช่วงเวลา)';
        } 
        else if (filter === 'day') {
            const todayStr = now.toISOString().split('T')[0];
            filteredData = allTransactions.filter(d => d.transaction_date === todayStr);
            textLabel.innerText = '(วันนี้)';
        }
        else if (filter === 'week') {
            // หาวันอาทิตย์ - เสาร์
            const startOfWeek = new Date(now); 
            startOfWeek.setDate(now.getDate() - now.getDay()); // ย้อนไปวันอาทิตย์
            const endOfWeek = new Date(startOfWeek); 
            endOfWeek.setDate(startOfWeek.getDate() + 6); // เดินหน้าไปวันเสาร์
            
            const startStr = startOfWeek.toISOString().split('T')[0];
            const endStr = endOfWeek.toISOString().split('T')[0];
            filteredData = allTransactions.filter(d => d.transaction_date >= startStr && d.transaction_date <= endStr);
            textLabel.innerText = `(สัปดาห์นี้: ${startStr} ถึง ${endStr})`;
        }
        else if (filter === 'month') {
            const currentMonth = now.toISOString().slice(0, 7);
            filteredData = allTransactions.filter(d => d.transaction_date.startsWith(currentMonth));
            textLabel.innerText = '(เดือนนี้)';
        }
        else if (filter === 'year') {
            const currentYear = now.getFullYear().toString();
            filteredData = allTransactions.filter(d => d.transaction_date.startsWith(currentYear));
            textLabel.innerText = `(ปี ${currentYear})`;
        }
        else if (filter === 'custom') {
            const start = document.getElementById('dateStart').value;
            const end = document.getElementById('dateEnd').value;
            if(start && end) {
                filteredData = allTransactions.filter(d => d.transaction_date >= start && d.transaction_date <= end);
                textLabel.innerText = `(${start} ถึง ${end})`;
            } else {
                filteredData = allTransactions; 
            }
        }

        renderTable(filteredData);
    }

    // --- 7. แสดงผลตาราง และคำนวณยอด ---
    function renderTable(data) {
        let tIn = 0, tOut = 0;
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';

        if (data.length === 0) {
            tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; padding: 40px; color: #aaa;">ไม่พบรายการบัญชีในฟิลเตอร์นี้ค่ะ 😊</td></tr>`;
        }

        data.forEach(item => {
            const isInc = item.type === 'income';
            if(isInc) tIn += item.amount; else tOut += item.amount;

            // จัดชื่อแบงค์
            const bankName = item.payment_methods ? item.payment_methods.bank_name : 'ไม่ระบุ';
            const accNo = item.payment_methods && item.payment_methods.account_no ? `(${item.payment_methods.account_no})` : '';

            tbody.innerHTML += `
                <tr>
                    <td style="font-weight: 500;">${item.transaction_date}</td>
                    <td>
                        <span class="type-badge" style="background: ${isInc ? '#dcfce7' : '#ffe4e6'}; color: ${isInc ? 'var(--income)' : 'var(--expense)'};">
                            ${isInc ? 'รับเข้า' : 'จ่ายออก'}
                        </span>
                        <div class="bank-badge"><i class='bx bxs-bank'></i> ${bankName} <span style="color:#888;">${accNo}</span></div>
                    </td>
                    <td style="font-weight: 500; font-size: 15px;">${item.note}</td>
                    <td style="font-weight: 700; color: ${isInc ? 'var(--income)' : 'var(--expense)'}; font-size: 16px;">
                        ${isInc ? '+' : '-'}฿${item.amount.toLocaleString(undefined, {minimumFractionDigits: 2})}
                    </td>
                    <td style="text-align: center;">
                        <button class="btn-delete" onclick="deleteTxn('${item.id}')" title="ลบรายการนี้"><i class='bx bx-trash'></i></button>
                    </td>
                </tr>
            `;
        });

        // อัปเดต Dashboard
        document.getElementById('sumIncome').innerText = `฿${tIn.toLocaleString(undefined, {minimumFractionDigits: 2})}`;
        document.getElementById('sumExpense').innerText = `฿${tOut.toLocaleString(undefined, {minimumFractionDigits: 2})}`;
        document.getElementById('sumBalance').innerText = `฿${(tIn - tOut).toLocaleString(undefined, {minimumFractionDigits: 2})}`;
    }

    // --- 8. บันทึก / ลบ ข้อมูล ---
    function openTxnModal() {
        document.getElementById('txnModal').classList.add('active');
        document.getElementById('inpDate').value = new Date().toISOString().split('T')[0];
    }
    
    function openBankModal() {
        document.getElementById('bankModal').classList.add('active');
    }

    function closeModal(id) { document.getElementById(id).classList.remove('active'); }

    async function saveTransaction() {
        const type = document.getElementById('inpType').value;
        const method_id = document.getElementById('inpMethod').value;
        const date = document.getElementById('inpDate').value;
        const note = document.getElementById('inpNote').value || 'ไม่มีชื่อรายการ';
        const amount = document.getElementById('inpAmount').value;

        if (!amount || amount <= 0) { Swal.fire('Oops!', 'ใส่จำนวนเงินก่อนจ้า!', 'warning'); return; }

        Swal.fire({ title: 'กำลังบันทึก...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

        // แสตมป์ owner_token ทุกครั้งที่บันทึก
        const { error } = await db.from('transactions').insert([{ 
            owner_token: ownerToken, type, amount: parseFloat(amount), note, method_id, transaction_date: date 
        }]);

        if (error) {
            Swal.fire('พัง!', error.message, 'error');
        } else {
            Swal.fire({ icon: 'success', title: 'ปังมาก บันทึกแล้ว!', timer: 1500, showConfirmButton: false });
            document.getElementById('inpAmount').value = '';
            document.getElementById('inpNote').value = '';
            closeModal('txnModal');
            fetchTransactions(); 
        }
    }

    function deleteTxn(id) {
        Swal.fire({
            title: 'ลบจริงดิ?',
            text: "ลบแล้วกู้ไม่ได้นะเตง!",
            icon: 'warning',
            showCancelButton: true,
            confirmButtonColor: '#f43f5e',
            cancelButtonColor: '#64748b',
            confirmButtonText: 'ลบทิ้งเลย!',
            cancelButtonText: 'เปลี่ยนใจ'
        }).then(async (result) => {
            if (result.isConfirmed) {
                const { error } = await db.from('transactions').delete().eq('id', id);
                if (error) Swal.fire('Error', error.message, 'error');
                else {
                    Swal.fire({ icon: 'success', title: 'ลบแล้วจ้า!', timer: 1500, showConfirmButton: false });
                    fetchTransactions();
                }
            }
        })
    }

    // --- 9. สร้างลิงก์เพิ่มเพื่อน (เฉพาะแอดมิน) ---
    async function addFriendPrompt() {
        const { value: friendName } = await Swal.fire({
            title: 'สร้างกระเป๋าให้เพื่อนใหม่',
            input: 'text',
            inputLabel: 'ใส่ชื่อเพื่อน (เพื่อสร้างลิงก์ส่วนตัวให้)',
            inputPlaceholder: 'เช่น น้องอ้อม',
            showCancelButton: true,
            confirmButtonText: 'สร้างลิงก์',
            confirmButtonColor: 'var(--primary)'
        });

        if (friendName) {
            // สร้าง Token แบบสุ่มให้เพื่อน
            const uniqueToken = "user_" + Date.now() + Math.floor(Math.random() * 1000);
            const currentUrl = window.location.href.split('?')[0]; 
            const inviteLink = `${currentUrl}?user=${uniqueToken}&name=${encodeURIComponent(friendName)}`;

            Swal.fire({
                title: 'เสร็จสิ้น! ✨',
                html: `<p style="font-size: 14px; margin-bottom: 10px;">ก๊อปปี้ลิงก์นี้ส่งให้ <b>${friendName}</b> ได้เลย<br>ข้อมูลจะไม่ชนกับเราแน่นอน!</p>
                       <input type="text" value="${inviteLink}" style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #ccc; font-weight: bold; color: var(--primary);" readonly id="linkCopy">`,
                icon: 'success',
                confirmButtonText: 'คัดลอกลิงก์'
            }).then((result) => {
                if (result.isConfirmed) {
                    navigator.clipboard.writeText(inviteLink);
                    Swal.fire('คัดลอกลง Clipboard แล้ว!', 'ส่งให้เพื่อนในแชทได้เลย', 'success');
                }
            });
        }
    }
</script>
